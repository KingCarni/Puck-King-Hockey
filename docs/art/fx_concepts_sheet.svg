<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1680 1000" font-family="Arial Black, Arial, sans-serif">
  <!-- Puck King Hell — effects concept sheet (reference only, not imported by Godot) -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#141417"/>
      <stop offset="1" stop-color="#0D0D0F"/>
    </linearGradient>
    <radialGradient id="flash" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.4" stop-color="#FFEB4D"/>
      <stop offset="1" stop-color="#FFEB4D" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="boom" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFEB4D"/>
      <stop offset="0.55" stop-color="#FF9A3D"/>
      <stop offset="1" stop-color="#FF382E" stop-opacity="0.2"/>
    </radialGradient>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0.4" stop-color="#8CE6FF" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#8CE6FF" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1680" height="1000" fill="url(#bg)"/>
  <rect x="24" y="24" width="1632" height="952" fill="none" stroke="#FFC71A" stroke-width="6" rx="18"/>
  <text x="60" y="92" fill="#F7F5EB" font-size="44" letter-spacing="2">PUCK KING HELL — EFFECTS CONCEPTS</text>
  <text x="60" y="130" fill="#8C949E" font-size="20">ADDITIVE-BRIGHT CENTERS · TEAM-COLOR EDGES · SHORT AND PUNCHY · NEVER HIDE THE PUCK</text>

  <!-- ================= ROW 1: GOAL EXPLOSION ================= -->
  <text x="60" y="205" fill="#FFC71A" font-size="28">GOAL EXPLOSION — 0.8 s TOTAL</text>
  <!-- stage 1 flash -->
  <g transform="translate(240 330)">
    <circle r="95" fill="url(#flash)"/>
    <circle r="34" fill="#FFFFFF"/>
    <text y="150" fill="#8C949E" font-size="19" text-anchor="middle">1 · FLASH  (0-0.1s)</text>
    <text y="176" fill="#8C949E" font-size="16" text-anchor="middle">white core + hit-stop 80 ms</text>
  </g>
  <!-- stage 2 burst -->
  <g transform="translate(620 330)">
    <path d="M0 -110 L24 -38 L98 -56 L48 -6 L110 32 L36 40 L52 108 L0 58 L-52 108 L-36 40 L-110 32 L-48 -6 L-98 -56 L-24 -38 Z"
          fill="url(#boom)" stroke="#141417" stroke-width="7"/>
    <path d="M-20 -64 L-20 -88 L-6 -74 L8 -96 L22 -74 L36 -88 L36 -64 Z" fill="#FFC71A" stroke="#141417" stroke-width="5" transform="scale(1.4)"/>
    <text y="150" fill="#8C949E" font-size="19" text-anchor="middle">2 · CROWN BURST  (0.1-0.4s)</text>
    <text y="176" fill="#8C949E" font-size="16" text-anchor="middle">gold crown + team-color starburst</text>
  </g>
  <!-- stage 3 confetti linger -->
  <g transform="translate(1000 330)">
    <g stroke="#141417" stroke-width="3">
      <rect x="-90" y="-70" width="16" height="10" fill="#2E8CFF" transform="rotate(24 -82 -65)"/>
      <rect x="-30" y="-100" width="16" height="10" fill="#FFC71A" transform="rotate(-18 -22 -95)"/>
      <rect x="40" y="-80" width="16" height="10" fill="#FF3338" transform="rotate(40 48 -75)"/>
      <rect x="86" y="-30" width="16" height="10" fill="#F7F5EB" transform="rotate(-30 94 -25)"/>
      <rect x="-70" y="10" width="16" height="10" fill="#FF3338" transform="rotate(60 -62 15)"/>
      <rect x="10" y="-20" width="16" height="10" fill="#2E8CFF" transform="rotate(-45 18 -15)"/>
      <rect x="60" y="40" width="16" height="10" fill="#FFC71A" transform="rotate(15 68 45)"/>
      <rect x="-20" y="60" width="16" height="10" fill="#F7F5EB" transform="rotate(-60 -12 65)"/>
    </g>
    <circle cx="0" cy="0" r="4" fill="#FFEB4D"/>
    <circle cx="-50" cy="-40" r="4" fill="#FFEB4D"/>
    <circle cx="55" cy="-10" r="4" fill="#FFEB4D"/>
    <text y="150" fill="#8C949E" font-size="19" text-anchor="middle">3 · CONFETTI LINGER  (0.4-0.8s)</text>
    <text y="176" fill="#8C949E" font-size="16" text-anchor="middle">gravity + fade, camera punch out</text>
  </g>
  <!-- goal horn note -->
  <g transform="translate(1360 330)">
    <rect x="-120" y="-110" width="270" height="230" rx="16" fill="#1B1B20" stroke="#8C949E" stroke-width="3"/>
    <text x="15" y="-70" fill="#FFC71A" font-size="20" text-anchor="middle">SUPPORT LAYERS</text>
    <text x="15" y="-34" fill="#8C949E" font-size="16" text-anchor="middle">screen shake 0.3 s</text>
    <text x="15" y="-6" fill="#8C949E" font-size="16" text-anchor="middle">goal light strobe (red)</text>
    <text x="15" y="22" fill="#8C949E" font-size="16" text-anchor="middle">scorer glow ring 1.5 s</text>
    <text x="15" y="50" fill="#8C949E" font-size="16" text-anchor="middle">crowd flash bulbs</text>
    <text x="15" y="78" fill="#8C949E" font-size="16" text-anchor="middle">net ripple on impact</text>
  </g>

  <!-- ================= ROW 2: CHECK / TRAIL / FREEZE / PUCK ================= -->
  <text x="60" y="560" fill="#FFC71A" font-size="28">IMPACT · MOVEMENT · CONTROL · PUCK STATES</text>

  <!-- body check -->
  <g transform="translate(240 730)">
    <path d="M0 -80 L18 -26 L74 -40 L34 -2 L80 26 L24 28 L36 78 L0 42 L-36 78 L-24 28 L-80 26 L-34 -2 L-74 -40 L-18 -26 Z"
          fill="#FFFFFF" stroke="#141417" stroke-width="6"/>
    <g stroke="#F7F5EB" stroke-width="6" stroke-linecap="round" opacity="0.8">
      <line x1="-110" y1="-60" x2="-84" y2="-44"/>
      <line x1="110" y1="-60" x2="84" y2="-44"/>
      <line x1="-116" y1="40" x2="-88" y2="30"/>
      <line x1="116" y1="40" x2="88" y2="30"/>
    </g>
    <text y="130" fill="#8C949E" font-size="19" text-anchor="middle">BODY CHECK  · 0.15 s</text>
    <text y="156" fill="#8C949E" font-size="16" text-anchor="middle">white star + speedlines + 60 ms hit-stop</text>
  </g>

  <!-- boost trail -->
  <g transform="translate(620 730)">
    <path d="M-110 40 Q-40 34 30 6 Q70 -12 96 -44" fill="none" stroke="#2E8CFF" stroke-width="16" stroke-linecap="round" opacity="0.85"/>
    <path d="M-110 40 Q-40 34 30 6 Q70 -12 96 -44" fill="none" stroke="#8CE6FF" stroke-width="7" stroke-linecap="round"/>
    <path d="M-104 58 Q-30 52 40 22" fill="none" stroke="#F7F5EB" stroke-width="4" stroke-linecap="round" opacity="0.6"/>
    <path d="M-98 24 Q-36 20 24 -8" fill="none" stroke="#F7F5EB" stroke-width="4" stroke-linecap="round" opacity="0.6"/>
    <circle cx="96" cy="-44" r="16" fill="#8CE6FF" opacity="0.9"/>
    <text y="130" fill="#8C949E" font-size="19" text-anchor="middle">BOOST TRAIL</text>
    <text y="156" fill="#8C949E" font-size="16" text-anchor="middle">team streak + twin ice-spray lines, 0.4 s fade</text>
  </g>

  <!-- freeze -->
  <g transform="translate(1000 730)">
    <circle r="72" fill="none" stroke="#8CE6FF" stroke-width="8" opacity="0.9"/>
    <circle r="88" fill="url(#halo)"/>
    <g fill="#8CE6FF" stroke="#141417" stroke-width="4" opacity="0.95">
      <path d="M-14 -96 L14 -96 L28 -72 L14 -48 L-14 -48 L-28 -72 Z"/>
      <path d="M58 -40 L82 -26 L82 2 L58 16 L34 2 L34 -26 Z" opacity="0.8"/>
      <path d="M-82 -20 L-58 -34 L-34 -20 L-34 8 L-58 22 L-82 8 Z" opacity="0.8"/>
      <path d="M-10 52 L10 52 L20 70 L10 88 L-10 88 L-20 70 Z" opacity="0.7"/>
    </g>
    <text y="150" fill="#8C949E" font-size="19" text-anchor="middle">FREEZE  · rim + crystal hexes</text>
    <text y="176" fill="#8C949E" font-size="16" text-anchor="middle">victim tinted #8CE6FF, shatter on release</text>
  </g>

  <!-- puck states -->
  <g transform="translate(1360 730)">
    <ellipse cx="-70" cy="0" rx="34" ry="15" fill="#0D0D0F" stroke="#8CE6FF" stroke-width="4"/>
    <circle cx="-70" cy="0" r="52" fill="url(#halo)"/>
    <ellipse cx="70" cy="0" rx="34" ry="15" fill="#0D0D0F" stroke="#FF382E" stroke-width="5"/>
    <path d="M36 0 Q-10 8 -20 0 Q-10 -8 36 0 Z" fill="#FF9A3D" opacity="0.85" transform="translate(66 0)"/>
    <circle cx="70" cy="0" r="52" fill="url(#boom)" opacity="0.35"/>
    <text y="130" fill="#8C949E" font-size="19" text-anchor="middle">PUCK: IDLE GLOW / SLAP-SHOT FIRE</text>
    <text y="156" fill="#8C949E" font-size="16" text-anchor="middle">halo always on · full-power shots burn</text>
  </g>
</svg>

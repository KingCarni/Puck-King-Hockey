<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Puck King Hell — HOME teammate skater, top-down, faces image-top -->
  <defs>
    <radialGradient id="shadow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0.55" stop-color="#000000" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="jersey" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4DA0FF"/>
      <stop offset="0.45" stop-color="#2E8CFF"/>
      <stop offset="1" stop-color="#1E63C8"/>
    </linearGradient>
    <linearGradient id="helm" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2A72DC"/>
      <stop offset="1" stop-color="#173F82"/>
    </linearGradient>
  </defs>

  <!-- baked ground shadow -->
  <ellipse cx="256" cy="272" rx="158" ry="146" fill="url(#shadow)"/>

  <!-- skate blades poking out behind -->
  <rect x="186" y="342" width="44" height="72" rx="22" fill="#141417"/>
  <rect x="282" y="342" width="44" height="72" rx="22" fill="#141417"/>
  <rect x="194" y="352" width="28" height="52" rx="14" fill="#8C949E"/>
  <rect x="290" y="352" width="28" height="52" rx="14" fill="#8C949E"/>

  <!-- body / jersey -->
  <rect x="108" y="182" width="296" height="176" rx="72" fill="url(#jersey)" stroke="#141417" stroke-width="11"/>
  <!-- shoulder yoke -->
  <path d="M124 240 Q124 190 180 188 L332 188 Q388 190 388 240 L388 250 Q322 226 256 226 Q190 226 124 250 Z" fill="#173F82"/>
  <!-- side trim stripes (bone only — teammates skip the gold) -->
  <rect x="122" y="216" width="16" height="118" rx="8" fill="#F7F5EB" opacity="0.92"/>
  <rect x="374" y="216" width="16" height="118" rx="8" fill="#F7F5EB" opacity="0.92"/>
  <!-- cel highlight -->
  <path d="M150 206 Q210 192 300 196 L296 214 Q214 210 158 224 Z" fill="#BFE1FF" opacity="0.5"/>

  <!-- stick: shaft + blade (forward-right) -->
  <g>
    <path d="M336 208 L296 66" stroke="#141417" stroke-width="30" stroke-linecap="round"/>
    <path d="M336 208 L296 66" stroke="#C98A3B" stroke-width="16" stroke-linecap="round"/>
    <g transform="rotate(-14 296 62)">
      <rect x="244" y="42" width="112" height="40" rx="18" fill="#C98A3B" stroke="#141417" stroke-width="10"/>
      <rect x="256" y="50" width="24" height="24" rx="6" fill="#F7F5EB"/>
      <rect x="288" y="50" width="24" height="24" rx="6" fill="#F7F5EB"/>
    </g>
  </g>

  <!-- arms / gloves -->
  <rect x="98" y="150" width="58" height="96" rx="29" fill="#1E63C8" stroke="#141417" stroke-width="10"/>
  <circle cx="128" cy="150" r="37" fill="#141417"/>
  <circle cx="128" cy="150" r="26" fill="#2B2B31"/>
  <rect x="106" y="140" width="44" height="12" rx="6" fill="#F7F5EB" opacity="0.85"/>
  <rect x="316" y="164" width="58" height="88" rx="29" fill="#1E63C8" stroke="#141417" stroke-width="10"/>
  <circle cx="346" cy="166" r="37" fill="#141417"/>
  <circle cx="346" cy="166" r="26" fill="#2B2B31"/>
  <rect x="324" y="156" width="44" height="12" rx="6" fill="#F7F5EB" opacity="0.85"/>

  <!-- helmet -->
  <circle cx="256" cy="244" r="82" fill="url(#helm)" stroke="#141417" stroke-width="11"/>
  <rect x="242" y="166" width="28" height="156" rx="14" fill="#2E8CFF"/>
  <!-- visor (faces forward / image-top) -->
  <rect x="214" y="166" width="84" height="24" rx="12" fill="#8CE6FF" opacity="0.9"/>
  <!-- teammate roundel (bone disc, no crown) -->
  <circle cx="256" cy="258" r="26" fill="#F7F5EB" stroke="#141417" stroke-width="7"/>
  <circle cx="256" cy="258" r="12" fill="#2E8CFF"/>
</svg>

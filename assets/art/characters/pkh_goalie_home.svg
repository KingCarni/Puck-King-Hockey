<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Puck King Hell — HOME goalie, top-down, faces image-top -->
  <defs>
    <radialGradient id="shadow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0.55" stop-color="#000000" stop-opacity="0.36"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="jersey" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4DA0FF"/>
      <stop offset="0.45" stop-color="#2E8CFF"/>
      <stop offset="1" stop-color="#1E63C8"/>
    </linearGradient>
    <linearGradient id="helm" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2A72DC"/>
      <stop offset="1" stop-color="#173F82"/>
    </linearGradient>
    <linearGradient id="pad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#D9D5C4"/>
    </linearGradient>
  </defs>

  <!-- baked ground shadow (wider than a skater) -->
  <ellipse cx="256" cy="270" rx="186" ry="158" fill="url(#shadow)"/>

  <!-- leg pads sticking out behind -->
  <rect x="130" y="322" width="82" height="128" rx="34" fill="url(#pad)" stroke="#141417" stroke-width="10"/>
  <rect x="300" y="322" width="82" height="128" rx="34" fill="url(#pad)" stroke="#141417" stroke-width="10"/>
  <rect x="148" y="340" width="46" height="92" rx="20" fill="none" stroke="#8C949E" stroke-width="7"/>
  <rect x="318" y="340" width="46" height="92" rx="20" fill="none" stroke="#8C949E" stroke-width="7"/>
  <rect x="130" y="376" width="82" height="14" fill="#2E8CFF" opacity="0.9"/>
  <rect x="300" y="376" width="82" height="14" fill="#2E8CFF" opacity="0.9"/>

  <!-- goalie stick paddle (right side, guards the ice) -->
  <path d="M368 220 L342 88" stroke="#141417" stroke-width="34" stroke-linecap="round"/>
  <path d="M368 220 L342 88" stroke="#C98A3B" stroke-width="20" stroke-linecap="round"/>
  <g transform="rotate(-10 340 76)">
    <rect x="252" y="52" width="176" height="48" rx="20" fill="#C98A3B" stroke="#141417" stroke-width="11"/>
    <rect x="268" y="62" width="30" height="28" rx="7" fill="#F7F5EB"/>
    <rect x="310" y="62" width="30" height="28" rx="7" fill="#F7F5EB"/>
    <rect x="352" y="62" width="30" height="28" rx="7" fill="#F7F5EB"/>
  </g>

  <!-- body / chest armor: wider than a skater -->
  <rect x="84" y="176" width="344" height="192" rx="86" fill="url(#jersey)" stroke="#141417" stroke-width="12"/>
  <path d="M102 242 Q102 186 166 182 L346 182 Q410 186 410 242 L410 254 Q334 226 256 226 Q178 226 102 254 Z" fill="#173F82"/>
  <rect x="98" y="216" width="18" height="132" rx="9" fill="#F7F5EB" opacity="0.92"/>
  <rect x="396" y="216" width="18" height="132" rx="9" fill="#F7F5EB" opacity="0.92"/>
  <rect x="122" y="216" width="9" height="132" rx="4" fill="#FFC71A" opacity="0.95"/>
  <rect x="381" y="216" width="9" height="132" rx="4" fill="#FFC71A" opacity="0.95"/>
  <path d="M132 200 Q206 186 312 190 L308 210 Q212 206 140 220 Z" fill="#BFE1FF" opacity="0.5"/>

  <!-- blocker (right) -->
  <rect x="360" y="150" width="92" height="70" rx="18" fill="url(#pad)" stroke="#141417" stroke-width="10"/>
  <rect x="374" y="162" width="64" height="12" rx="6" fill="#8C949E"/>
  <rect x="374" y="182" width="64" height="12" rx="6" fill="#8C949E"/>

  <!-- catch glove (left) -->
  <circle cx="102" cy="176" r="52" fill="url(#pad)" stroke="#141417" stroke-width="10"/>
  <path d="M70 148 A44 44 0 0 1 134 146" fill="none" stroke="#8C949E" stroke-width="9" stroke-linecap="round"/>
  <circle cx="102" cy="176" r="20" fill="#2E8CFF" stroke="#141417" stroke-width="7"/>

  <!-- goalie mask -->
  <circle cx="256" cy="248" r="90" fill="url(#helm)" stroke="#141417" stroke-width="12"/>
  <rect x="240" y="162" width="32" height="170" rx="16" fill="#2E8CFF"/>
  <!-- cage (faces forward / image-top) -->
  <rect x="204" y="162" width="104" height="30" rx="15" fill="#F7F5EB" opacity="0.95"/>
  <g stroke="#141417" stroke-width="5">
    <line x1="222" y1="164" x2="222" y2="192"/>
    <line x1="244" y1="164" x2="244" y2="192"/>
    <line x1="268" y1="164" x2="268" y2="192"/>
    <line x1="290" y1="164" x2="290" y2="192"/>
  </g>
  <!-- crown mark on the mask -->
  <path d="M222 292 L222 248 L239 264 L256 236 L273 264 L290 248 L290 292 Z" fill="#FFC71A" stroke="#141417" stroke-width="8" stroke-linejoin="round"/>
  <rect x="222" y="284" width="68" height="13" rx="5" fill="#FFEB4D" stroke="#141417" stroke-width="5"/>
</svg>

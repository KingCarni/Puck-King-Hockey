  <path d="M160 170 L212 188" stroke="#F7F5EB" stroke-width="9" stroke-linecap="round"/>
  <!-- growth arrows -->
  <path d="M56 176 L56 216 M56 216 L42 202 M56 216 L70 202" stroke="#FF382E" stroke-width="9" stroke-linecap="round" fill="none"/>
  <path d="M200 64 L200 34 M200 34 L188 46 M200 34 L212 46" stroke="#FF382E" stroke-width="9" stroke-linecap="round" fill="none"/>
</svg>

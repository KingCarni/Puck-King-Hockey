  <ellipse cx="196" cy="196" rx="30" ry="13" fill="#2B2B31" stroke="#141417" stroke-width="6"/>
  <ellipse cx="188" cy="192" rx="10" ry="4" fill="#8C949E" opacity="0.8"/>

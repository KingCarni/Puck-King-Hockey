<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <!-- Puck King Hell — puck, top-down, high-readability pass -->
  <defs>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0.42" stop-color="#9BEFFF" stop-opacity="0.62"/>
      <stop offset="0.70" stop-color="#62DFFF" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#62DFFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="shadow" cx="0.5" cy="0.58" r="0.52">
      <stop offset="0.20" stop-color="#000000" stop-opacity="0.50"/>
      <stop offset="0.78" stop-color="#000000" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="top" cx="0.34" cy="0.28" r="0.82">
      <stop offset="0" stop-color="#303038"/>
      <stop offset="0.48" stop-color="#101014"/>
      <stop offset="1" stop-color="#020204"/>
    </radialGradient>
  </defs>

  <!-- tiny baked shadow so the puck separates from bright ice -->
  <ellipse cx="128" cy="139" rx="83" ry="72" fill="url(#shadow)"/>

  <!-- subtle glow halo: the puck must never be lost -->
  <circle cx="128" cy="128" r="122" fill="url(#halo)"/>
  <circle cx="128" cy="128" r="92" fill="none" stroke="#9BEFFF" stroke-width="8" opacity="0.58"/>

  <!-- rubber body with thicker silhouette -->
  <circle cx="128" cy="128" r="78" fill="#000000" opacity="0.95"/>
  <circle cx="128" cy="128" r="69" fill="url(#top)" stroke="#000000" stroke-width="10"/>
  <circle cx="128" cy="128" r="52" fill="none" stroke="#32323A" stroke-width="5" opacity="0.85"/>

  <!-- steel rim highlight -->
  <path d="M72 105 A63 63 0 0 1 119 64" fill="none" stroke="#A8B2BF" stroke-width="8" stroke-linecap="round" opacity="0.95"/>
  <!-- top sheen -->
  <ellipse cx="106" cy="101" rx="25" ry="14" fill="#F7F5EB" opacity="0.16" transform="rotate(-24 106 101)"/>
  <!-- crown stamp, smaller so the black puck stays dominant -->
  <path d="M109 149 L109 125 L119 134 L128 117 L137 134 L147 125 L147 149 Z" fill="#FFC71A" opacity="0.82" stroke="#050506" stroke-width="5" stroke-linejoin="round"/>
</svg>

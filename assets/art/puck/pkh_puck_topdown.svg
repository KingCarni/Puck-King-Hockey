<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <!-- Puck King Hell — puck, top-down, with baked readability halo -->
  <defs>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0.50" stop-color="#8CE6FF" stop-opacity="0.55"/>
      <stop offset="0.72" stop-color="#8CE6FF" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#8CE6FF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="top" cx="0.38" cy="0.34" r="0.75">
      <stop offset="0" stop-color="#3A3A42"/>
      <stop offset="0.55" stop-color="#1B1B20"/>
      <stop offset="1" stop-color="#0D0D0F"/>
    </radialGradient>
  </defs>

  <!-- glow halo: the puck must never be lost -->
  <circle cx="128" cy="128" r="122" fill="url(#halo)"/>
  <circle cx="128" cy="128" r="86" fill="none" stroke="#8CE6FF" stroke-width="6" opacity="0.5"/>

  <!-- rubber body -->
  <circle cx="128" cy="128" r="72" fill="#0D0D0F"/>
  <circle cx="128" cy="128" r="64" fill="url(#top)" stroke="#141417" stroke-width="6"/>
  <!-- steel rim highlight -->
  <path d="M74 106 A60 60 0 0 1 118 68" fill="none" stroke="#8C949E" stroke-width="7" stroke-linecap="round" opacity="0.9"/>
  <!-- top sheen -->
  <ellipse cx="106" cy="104" rx="26" ry="16" fill="#F7F5EB" opacity="0.14" transform="rotate(-24 106 104)"/>
  <!-- crown stamp -->
  <path d="M108 148 L108 122 L118 132 L128 114 L138 132 L148 122 L148 148 Z" fill="#FFC71A" opacity="0.85" stroke="#0D0D0F" stroke-width="4" stroke-linejoin="round"/>
</svg>
